[[commands]]
name = "/backup-surface"
description = "Back up the unique reusable OpenCrabs surface to a sanitized local git workspace with allowlist collection, scanning, local commits, restore support, and explicit approval before GitHub push."
action = "prompt"
prompt = "Use the installed OpenCrabs skill `backup-surface` from ~/.opencrabs/skills/backup-surface/SKILL.md. Follow that skill exactly to collect, scan, status, initialize, locally commit, restore, or prepare a GitHub push for the sanitized OpenCrabs surface backup. Treat trailing slash-command arguments as the requested backup operation. Never push to GitHub without explicit approval."
