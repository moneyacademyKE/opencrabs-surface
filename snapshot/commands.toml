[[commands]]
name = "/review"
description = "Route review/audit/check requests to the right OpenCrabs specialist skill: code review, openspeq review, prompt scan, verification witness, security/repo audit, or design review."
action = "prompt"
prompt = "Use the installed OpenCrabs skill `review` from ~/.opencrabs/skills/review/SKILL.md. Follow that skill exactly to choose and compose the correct specialist review route."

[[commands]]
name = "/axiom"
description = "Delegate a bounded build task to the local Axiom repo so Axiom supervises an opencode harness against an observable workspace."
action = "prompt"
prompt = "Use the installed OpenCrabs skill `axiom` from ~/.opencrabs/skills/axiom/SKILL.md. Follow that skill exactly to route the user's trailing request into a bounded Axiom-supervised opencode build workflow in ~/Desktop/axiom. Treat the trailing slash-command arguments as the task brief, make the task observable and verifiable, and be explicit that this launches delegated Axiom-managed work rather than hijacking an already-running opencode TUI session."

[[commands]]
name = "/mission-control"
description = "Generate and send the Mission Control analytics report for this OpenCrabs instance."
action = "prompt"
prompt = "Use the built-in OpenCrabs tool `mission_control_report` to generate the current Mission Control analytics report, then present it clearly in the current chat."

[[commands]]
name = "/heartbeat-review"
description = "Review the current heartbeat policy and summarize what the autoheal pulse checks and when it speaks."
action = "prompt"
prompt = "Read ~/.opencrabs/HEARTBEAT.md and summarize the current heartbeat policy: what it checks, when it reports, and the main safety rules. Keep the summary concise and operational."

[[commands]]
name = "/memory"
description = "Search long-term memory (MEMORY.md) and daily memory logs for a query. Optional args become the search query."
action = "prompt"
prompt = "Use the `memory_search` tool to search long-term memory for the user's trailing arguments. If no arguments were given, load and summarize ~/.opencrabs/MEMORY.md instead (headings + recent entries only). Present hits concisely with the most relevant first."

[[commands]]
name = "/inflight"
description = "Show currently in-flight non-plan-tracked work from the autoheal ledger."
action = "prompt"
prompt = "Read ~/.opencrabs/state/inflight.md. If there are no live entries below the comment marker, reply with a one-liner: 'No work in flight.' Otherwise list each entry with its timestamp and note any entry older than 15 minutes (likely interrupted). Do not modify the file."

[[commands]]
name = "/kb"
description = "Operate the OpenCrabs-native knowledge base: setup, ingest, search, ask with citations, stats, and connector extension."
action = "prompt"
prompt = "Use the installed OpenCrabs skill `knowledge-base` from ~/.opencrabs/skills/knowledge-base/SKILL.md. Follow that skill exactly to operate the local knowledge base in ~/.opencrabs/projects/knowledge-base/files/: setup config, ingest selected sources, run stats/search/ask, and extend connectors safely. Treat trailing slash-command arguments as the requested knowledge-base operation."

[[commands]]
name = "/knowledge-base"
