[[commands]]
name = "/openspeq-init"
description = "Initialize or refresh a repo-local openspeq spec workspace using the installed openspeq-init skill."
action = "prompt"
prompt = "Use the installed OpenCrabs skill `openspeq-init` from ~/.opencrabs/skills/openspeq-init/SKILL.md. Follow that skill exactly to initialize or refresh an openspeq spec workspace in the current repository."

[[commands]]
name = "/openspeq-plan"
description = "Plan a change with openspeq by staging repo-native plan and delta docs using the installed openspeq-plan skill."
action = "prompt"
prompt = "Use the installed OpenCrabs skill `openspeq-plan` from ~/.opencrabs/skills/openspeq-plan/SKILL.md. Follow that skill exactly to create a scoped plan under specs/_plans for the current repository change."

[[commands]]
name = "/openspeq-record"
description = "Finalize an openspeq change by recording accepted staged specs with the installed openspeq-record skill."
action = "prompt"
prompt = "Use the installed OpenCrabs skill `openspeq-record` from ~/.opencrabs/skills/openspeq-record/SKILL.md. Follow that skill exactly to merge accepted staged knowledge into permanent specs after implementation and verification."

[[commands]]
