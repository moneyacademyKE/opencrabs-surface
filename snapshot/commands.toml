action = "prompt"
prompt = "Use the installed OpenCrabs skill `verification-witness` from ~/.opencrabs/skills/verification-witness/SKILL.md. Follow that skill exactly to produce a verification witness with files changed, commands run, results, links, risks, and verdict."

[[commands]]
name = "/design-engineering"
description = "Umbrella design-engineering skill for distinctive UI design, polish, fluid interaction, motion review, and animation vocabulary."
action = "prompt"
